# Render.com blueprint: New > Blueprint > point at this repo
databases:
  - name: pt-db
    plan: free
services:
  - type: web
    name: pt-ml
    runtime: docker
    dockerContext: services/ml
    dockerfilePath: services/ml/Dockerfile
  - type: web
    name: pt-api
    runtime: docker
    dockerContext: services/api
    dockerfilePath: services/api/Dockerfile
    envVars:
      - { key: DATABASE_URL, fromDatabase: { name: pt-db, property: connectionString } }
      - { key: ML_URL, fromService: { type: web, name: pt-ml, property: hostport } }
      - { key: PRICE_PROVIDER, value: yfinance }
      - { key: CORS_ORIGINS, value: "https://YOUR-GITHUB-USERNAME.github.io" }  # dashboard origin on GitHub Pages
