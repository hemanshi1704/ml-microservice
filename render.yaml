# Render.com blueprint: New > Blueprint > point at this repo
services:
  - type: web
    name: pt-ml
    runtime: docker
    plan: free
    dockerContext: services/ml
    dockerfilePath: services/ml/Dockerfile
  - type: web
    name: pt-api
    runtime: docker
    plan: free
    dockerContext: services/api
    dockerfilePath: services/api/Dockerfile
    envVars:
      - { key: DATABASE_URL, sync: false }
      - { key: ML_URL, fromService: { type: web, name: pt-ml, property: hostport } }
      - { key: PRICE_PROVIDER, value: yfinance }
      - { key: CORS_ORIGINS, value: "https://hemanshi1704.github.io" } # dashboard origin on GitHub Pages
